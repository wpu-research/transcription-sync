[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transcription-sync"
version = "0.1.0"
description = "Real-time, training-free, CPU-cheap lip-sync from a transcription text stream to ARKit mouth blendshapes."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Murat Arslan", email = "research@wpu.edu.tr" }]
keywords = ["lip-sync", "viseme", "arkit", "blendshapes", "avatar", "tts", "llm", "real-time", "phoneme"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = []

[project.optional-dependencies]
audio = ["numpy>=1.21"]
dev = ["numpy>=1.21", "pytest>=7"]

[project.urls]
Homepage = "https://github.com/wpu-research/transcription-sync"
Issues = "https://github.com/wpu-research/transcription-sync/issues"

[tool.setuptools.packages.find]
where = ["src"]
